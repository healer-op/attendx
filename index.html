<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Evening School Attendance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f2f4f9;
  --card:#fff;
  --tx:#12203a;
  --mu:#6a7490;
  --bd:#e3e7f1;
  --ink:#1d2a5a;
  --plum:#4b2a6b;
  --am:#f4b740;
  --g:#16a34a;
  --l:#e59a0b;
  --r:#e5484d;
  --sh:0 8px 28px rgba(29,42,90,.09);
  --rad:14px
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0d1224;
    --card:#161c36;
    --tx:#e9ecf8;
    --mu:#8a93b6;
    --bd:#262e52;
    --sh:0 8px 28px rgba(0,0,0,.45)
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0
}

body{
  font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;
  background:var(--bg);
  color:var(--tx);
  padding-bottom:env(safe-area-inset-bottom,0)
}

[hidden]{
  display:none!important
}

button,input,textarea{
  font:inherit;
  color:inherit
}

input,textarea{
  width:100%;
  padding:11px 13px;
  border:1.5px solid var(--bd);
  border-radius:11px;
  background:var(--card);
  outline:none;
  transition:border-color .2s,box-shadow .2s
}

input:focus,textarea:focus{
  border-color:var(--am);
  box-shadow:0 0 0 3px rgba(244,183,64,.25)
}

button{
  cursor:pointer;
  border:0;
  background:none
}

button:focus-visible{
  outline:2px solid var(--am);
  outline-offset:2px
}

.pri{
  background:linear-gradient(135deg,var(--ink),var(--plum));
  color:#fff;
  padding:11px 18px;
  border-radius:11px;
  font-weight:600;
  transition:transform .15s,filter .2s
}

.pri:hover{
  filter:brightness(1.15)
}

.pri:active{
  transform:scale(.96)
}

.gh{
  padding:10px 14px;
  border-radius:11px;
  border:1.5px solid var(--bd);
  background:var(--card);
  font-weight:600;
  transition:transform .15s,border-color .2s
}

.gh:hover{
  border-color:var(--am)
}

.gh:active{
  transform:scale(.96)
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:linear-gradient(135deg,var(--ink),var(--plum));
  color:#fff;
  padding:calc(10px + env(safe-area-inset-top,0)) 16px 0
}

.hw{
  max-width:760px;
  margin:auto
}

.top{
  display:flex;
  align-items:center;
  gap:10px;
  justify-content:space-between
}

.top h1{
  font-size:17px;
  margin:0;
  font-weight:800;
  letter-spacing:-.2px
}

.top h1 span{
  display:inline-block;
  animation:moon 4s ease-in-out infinite
}

.me{
  font-size:12.5px;
  opacity:.85;
  display:flex;
  align-items:center;
  gap:8px
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#888;
  transition:background .3s
}

.dot.ok{
  background:#4ade80
}

.dot.err{
  background:#f87171
}

.dot.sy{
  background:var(--am);
  animation:pulse 1s infinite
}

.tabs{
  display:flex;
  gap:4px;
  margin-top:8px
}

.tabs button{
  color:#fff;
  opacity:.7;
  padding:9px 16px;
  border-radius:10px 10px 0 0;
  font-weight:600;
  transition:all .2s
}

.tabs button.on{
  background:var(--bg);
  color:var(--tx);
  opacity:1
}

main{
  max-width:760px;
  margin:auto;
  padding:14px 14px 90px
}

.tb{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px
}

.tb input[type=search]{
  flex:1 1 200px
}

.seg{
  display:flex;
  background:var(--card);
  border:1.5px solid var(--bd);
  border-radius:11px;
  padding:3px
}

.seg button{
  padding:7px 11px;
  border-radius:8px;
  font-weight:600;
  color:var(--mu);
  transition:all .2s
}

.seg button.on{
  background:var(--ink);
  color:#fff
}

.chips{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:2px 0 10px;
  scrollbar-width:none
}

.chip{
  flex:none;
  padding:7px 12px;
  border-radius:99px;
  background:var(--card);
  border:1.5px solid var(--bd);
  font-weight:600;
  font-size:13px;
  transition:all .2s
}

.chip b{
  margin-left:5px;
  transition:transform .25s;
  display:inline-block
}

.chip.on{
  border-color:var(--ink);
  background:var(--ink);
  color:#fff
}

.chip.P b{
  color:var(--g)
}

.chip.L b{
  color:var(--l)
}

.chip.A b{
  color:var(--r)
}

.chip.on b{
  color:#fff
}

.bar{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:10px
}

.bar input[type=date]{
  width:auto;
  font-weight:600
}

.ban{
  background:rgba(22,163,74,.12);
  color:var(--g);
  border:1.5px solid var(--g);
  padding:9px 13px;
  border-radius:11px;
  font-weight:600;
  margin-bottom:10px;
  animation:pop .35s
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--card);
  border-radius:var(--rad);
  padding:10px 12px;
  margin-bottom:8px;
  box-shadow:var(--sh);
  animation:up .35s both;
  animation-delay:calc(var(--i)*22ms)
}

.av{
  flex:none;
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:800;
  font-size:14px
}

.who{
  flex:1;
  min-width:0;
  cursor:pointer
}

.who b{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.who small{
  color:var(--mu)
}

.tag{
  font-style:normal;
  font-size:11px;
  background:var(--am);
  color:#3a2a00;
  border-radius:6px;
  padding:1px 6px;
  margin-left:6px;
  font-weight:700
}

.btns{
  display:flex;
  gap:6px
}

.btns button{
  width:40px;
  height:40px;
  border-radius:11px;
  border:1.5px solid var(--bd);
  font-weight:800;
  color:var(--mu);
  transition:transform .15s,background .2s,color .2s
}

.btns button:active{
  transform:scale(.85)
}

.btns button:disabled{
  opacity:.4;
  cursor:not-allowed
}

.btns .P.on{
  background:var(--g);
  border-color:var(--g);
  color:#fff;
  animation:pop .3s
}

.btns .L.on{
  background:var(--l);
  border-color:var(--l);
  color:#fff;
  animation:pop .3s
}

.btns .A.on{
  background:var(--r);
  border-color:var(--r);
  color:#fff;
  animation:pop .3s
}

.rt{
  font-weight:800;
  font-size:13px;
  padding:5px 10px;
  border-radius:99px;
  background:var(--bg)
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:var(--mu);
  animation:up .4s
}

.empty .pri{
  margin-top:10px
}

.ov{
  position:fixed;
  inset:0;
  background:rgba(10,14,35,.55);
  backdrop-filter:blur(4px);
  z-index:50;
  display:grid;
  place-items:center;
  padding:16px;
  animation:fade .25s
}

.box{
  background:var(--card);
  border-radius:20px;
  padding:22px;
  width:100%;
  max-width:400px;
  box-shadow:var(--sh);
  animation:pop .35s;
  display:grid;
  gap:10px;
  max-height:90vh;
  overflow:auto
}

.box h2,.box h1{
  margin:0
}

.err{
  color:var(--r);
  min-height:18px;
  font-size:13px
}

.dr{
  position:fixed;
  top:0;
  right:0;
  bottom:0;
  width:min(440px,100%);
  background:var(--bg);
  z-index:60;
  padding:18px;
  overflow:auto;
  box-shadow:-10px 0 40px rgba(0,0,0,.3);
  animation:slide .35s cubic-bezier(.2,.9,.3,1)
}

.dr .hd{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:14px
}

.dr .hd .av{
  width:56px;
  height:56px;
  font-size:19px
}

.card{
  background:var(--card);
  border-radius:var(--rad);
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--sh)
}

.card h3{
  margin:0 0 10px;
  font-size:13px;
  color:var(--mu);
  font-weight:600
}

.rg{
  display:flex;
  gap:16px;
  align-items:center
}

.ring circle{
  fill:none;
  stroke-width:10
}

.ring .bg{
  stroke:var(--bd)
}

.ring .fg{
  stroke:var(--g);
  stroke-linecap:round;
  transition:stroke-dashoffset 1.1s cubic-bezier(.2,.9,.3,1);
  transform:rotate(-90deg);
  transform-origin:50% 50%
}

.ring text{
  font-weight:800;
  font-size:22px;
  fill:var(--tx)
}

.kv{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  flex:1
}

.kv div{
  background:var(--bg);
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  color:var(--mu)
}

.kv b{
  display:block;
  font-size:18px;
  color:var(--tx)
}

.hm{
  display:grid;
  grid-template-rows:repeat(7,1fr);
  grid-auto-flow:column;
  gap:3px
}

.hm i{
  aspect-ratio:1;
  border-radius:4px;
  background:var(--bd);
  animation:pop .4s both;
  animation-delay:calc(var(--i)*8ms)
}

.hm .P{
  background:var(--g)
}

.hm .L{
  background:var(--l)
}

.hm .A{
  background:var(--r)
}

.hm .n{
  opacity:.35
}

.mb{
  display:flex;
  gap:10px;
  align-items:flex-end;
  height:90px
}

.mb div{
  flex:1;
  text-align:center;
  font-size:11px;
  color:var(--mu);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  height:100%
}

.mb span{
  display:block;
  background:linear-gradient(var(--am),var(--l));
  border-radius:6px 6px 0 0;
  height:0;
  transition:height .9s cubic-bezier(.2,.9,.3,1)
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(20px + env(safe-area-inset-bottom,0));
  transform:translateX(-50%);
  background:var(--ink);
  color:#fff;
  padding:11px 18px;
  border-radius:12px;
  z-index:90;
  animation:up .3s;
  box-shadow:var(--sh);
  max-width:90%
}

.toast.bad{
  background:var(--r)
}

.fab{
  position:fixed;
  right:16px;
  bottom:calc(18px + env(safe-area-inset-bottom,0));
  z-index:30;
  background:var(--am);
  color:#3a2a00;
  font-weight:800;
  padding:14px 20px;
  border-radius:99px;
  box-shadow:0 10px 26px rgba(244,183,64,.45);
  transition:transform .15s
}

.fab:active{
  transform:scale(.93)
}

.f2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.tutor-only{
  display:none
}

.tutor .tutor-only{
  display:inline-block
}

@keyframes up{
  from{
    opacity:0;
    transform:translateY(12px)
  }
}

@keyframes fade{
  from{
    opacity:0
  }
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.85)
  }
}

@keyframes slide{
  from{
    transform:translateX(100%)
  }
}

@keyframes pulse{
  50%{
    opacity:.35
  }
}

@keyframes moon{
  50%{
    transform:rotate(-12deg) translateY(-1px)
  }
}

@media(prefers-reduced-motion:reduce){
  *{
    animation:none!important;
    transition:none!important
  }
}

@media(max-width:420px){
  .row{
    gap:8px;
    padding:9px
  }

  .btns button{
    width:36px
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="login" class="ov">
  <div class="box">

    <h1>🌙 Evening School</h1>

    <p style="margin:0;color:var(--mu)">
      Enter your name and the PIN shared by your coordinator.
    </p>

    <!--
      autocomplete is intentionally disabled.
      Random/nonstandard name attributes discourage
      browser password managers from filling these fields.
    -->

    <input
      id="ln"
      type="text"
      placeholder="Your name"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="words"
      spellcheck="false"
      name="school_user_random_7391"
      data-lpignore="true"
      data-1p-ignore="true"
    >

    <input
      id="lp"
      type="password"
      placeholder="PIN"
      autocomplete="new-password"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      name="school_pin_random_5824"
      inputmode="numeric"
      data-lpignore="true"
      data-1p-ignore="true"
    >

    <button class="pri" id="lg" type="button">
      Continue
    </button>

    <div class="err" id="le"></div>

  </div>
</div>


<!-- =========================
     APP
========================= -->

<div id="app" hidden>

<header>
  <div class="hw">

    <div class="top">

      <h1>
        <span>🌙</span> Evening School
      </h1>

      <div class="me">

        <i class="dot" id="dot"></i>

        <span id="me"></span>

        <button
          class="gh"
          id="out"
          style="padding:4px 9px;color:#fff;background:transparent;border-color:rgba(255,255,255,.3)"
        >
          Exit
        </button>

      </div>

    </div>

    <div class="tabs">

      <button class="on" data-t="att">
        Attendance
      </button>

      <button data-t="stu">
        People
      </button>

    </div>

  </div>
</header>


<main>

  <div class="tb">

    <input
      id="q"
      type="search"
      placeholder="Search name, class, phone…  ( / )"
      autocomplete="off"
    >

    <div class="seg" id="wh">

      <button class="on" data-w="all">
        All
      </button>

      <button data-w="student">
        Students
      </button>

      <button data-w="volunteer">
        Volunteers
      </button>

    </div>

  </div>


  <!-- =========================
       ATTENDANCE
  ========================= -->

  <section id="vAtt">

    <div class="bar">

      <input type="date" id="dt">

      <button class="gh" id="rest">
        Mark rest present
      </button>

      <button class="gh tutor-only" id="ver">
        ✔ Verify day
      </button>

    </div>

    <div id="ban"></div>

    <div class="chips" id="chips">

      <button class="chip on" data-f="all">
        All<b id="c-all">0</b>
      </button>

      <button class="chip" data-f="U">
        Unmarked<b id="c-U">0</b>
      </button>

      <button class="chip P" data-f="P">
        Present<b id="c-P">0</b>
      </button>

      <button class="chip L" data-f="L">
        Late<b id="c-L">0</b>
      </button>

      <button class="chip A" data-f="A">
        Absent<b id="c-A">0</b>
      </button>

    </div>

    <div id="list"></div>

  </section>


  <!-- =========================
       PEOPLE
  ========================= -->

  <section id="vStu" hidden>

    <div class="bar">

      <button class="gh" id="exp">
        ⬇ Export Excel
      </button>

    </div>

    <div id="slist"></div>

  </section>

</main>


<button class="fab" id="add">
  + New person
</button>

</div>


<div id="modal" class="ov" hidden></div>

<div id="drawer" hidden></div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API='https://attendance-api.healerzee51.workers.dev';


/* =========================================================
   HELPERS
========================================================= */

const $=s=>document.querySelector(s);

const esc=s=>String(s??'').replace(
  /[&<>"']/g,
  c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

const today=()=>new Date().toLocaleDateString('en-CA');

const ini=n=>n
  .trim()
  .split(/\s+/)
  .slice(0,2)
  .map(w=>w[0])
  .join('')
  .toUpperCase();

const col=n=>{
  let h=0;

  for(const c of n)
    h=(h*31+c.charCodeAt(0))%360;

  return `hsl(${h} 55% 48%)`;
};

const marks=d=>
  Object.keys(A[d]||{}).some(k=>k[0]!=='_');


/* =========================================================
   STATE
========================================================= */

let auth=JSON.parse(
  localStorage.getItem('att_auth')||'null'
);

let S=JSON.parse(
  localStorage.getItem('att_students')||'[]'
);

let A={};

let date=today();

let flt='all';

let who='all';

let tab='att';

let pending=0;

let editing=null;

let tt;


/* =========================================================
   TOAST
========================================================= */

function toast(m,bad){

  clearTimeout(tt);

  document.querySelector('.toast')?.remove();

  const t=document.createElement('div');

  t.className='toast'+(bad?' bad':'');

  t.textContent=m;

  document.body.append(t);

  tt=setTimeout(
    ()=>t.remove(),
    2600
  );
}


/* =========================================================
   CONNECTION STATUS
========================================================= */

const sync=s=>{
  $('#dot').className='dot '+s;
};


/* =========================================================
   API
========================================================= */

async function api(p,o={}){

  const r=await fetch(
    API+p,
    {
      ...o,

      headers:{
        Authorization:'Bearer '+auth.pin,
        'Content-Type':'application/json'
      },

      body:o.body &&
        JSON.stringify(o.body)
    }
  );

  const j=await r.json().catch(()=>({}));

  if(r.status===401){

    localStorage.removeItem('att_auth');

    location.reload();

  }

  if(!r.ok)
    throw new Error(
      j.error||'Request failed'
    );

  return j;
}


/* =========================================================
   STUDENT SEARCH INDEX
========================================================= */

const k=s=>{
  s._k=[
    s.name,
    s.cls,
    s.phone,
    s.guardian,
    s.id
  ].join(' ').toLowerCase();
};


/* =========================================================
   ACTIVE PEOPLE
========================================================= */

const act=()=>S.filter(
  s=>
    s.active!==false &&
    (
      who==='all' ||
      (s.type||'student')===who
    )
);


/* =========================================================
   LOCKED DAY
========================================================= */

const locked=()=>
  A[date]?._v &&
  auth.role!=='tutor';


/* =========================================================
   LOGIN
========================================================= */

$('#lg').onclick=async()=>{

  const name=$('#ln').value.trim();

  const pin=$('#lp').value;

  if(!name||!pin){

    $('#le').textContent=
      'Enter name and PIN';

    return;
  }

  auth={
    name,
    pin
  };

  try{

    const r=await api('/api/ping');

    auth.role=r.role;

    localStorage.setItem(
      'att_auth',
      JSON.stringify(auth)
    );

    boot();

  }catch(e){

    $('#le').textContent=
      e.message==='Failed to fetch'
        ?'Cannot reach server'
        :e.message;

  }

};


/* =========================================================
   ENTER KEY LOGIN
========================================================= */

$('#lp').addEventListener(
  'keydown',
  e=>{

    if(e.key==='Enter'){

      e.preventDefault();

      $('#lg').click();

    }

  }
);


/* =========================================================
   LOGOUT
========================================================= */

$('#out').onclick=()=>{

  localStorage.removeItem('att_auth');

  location.reload();

};


/* =========================================================
   AUTOFILL PREVENTION
========================================================= */

/*
  Browsers can sometimes ignore autocomplete="off"
  for login/password-looking fields.

  This clears the fields when the page loads and
  explicitly makes them editable.
*/

window.addEventListener(
  'load',
  ()=>{

    const nameInput=$('#ln');

    const pinInput=$('#lp');

    if(nameInput){

      nameInput.value='';

      nameInput.disabled=false;

      nameInput.readOnly=false;

      nameInput.setAttribute(
        'autocomplete',
        'off'
      );

    }

    if(pinInput){

      pinInput.value='';

      pinInput.disabled=false;

      pinInput.readOnly=false;

      pinInput.setAttribute(
        'autocomplete',
        'new-password'
      );

    }

  }
);


/* =========================================================
   BOOT
========================================================= */

function boot(){

  $('#login').hidden=true;

  $('#app').hidden=false;

  $('#me').textContent=
    auth.name+
    (
      auth.role==='tutor'
        ?' · Tutor'
        :''
    );

  document.body.classList.toggle(
    'tutor',
    auth.role==='tutor'
  );

  $('#dt').value=date;

  S.forEach(k);

  A[date]={};

  render();

  load();

  setInterval(
    poll,
    20000
  );
}

  let L=act().filter(
    s=>
      qs.every(
        t=>s._k.includes(t)

  return L.sort(

/* =========================================================
   MARK ATTENDANCE
========================================================= */

async function mark(id,s){

  if(locked())
    return toast(
      'Day is verified and locked',
      true
    );

  const d=date;

  A[d]=A[d]||{};

  const prev=A[d][id];

  if(prev&&prev.s===s)
    s=null;

  s
    ?A[d][id]={
        s,
        by:auth.name,
        t:Date.now()
      }
    :delete A[d][id];

  patch(id);

  pending++;

  sync('sy');

  try{

    await api(
      '/api/attendance',
      {
        method:'POST',

        body:{
          date:d,

          marks:[
            {
              id,
              status:s
            }
          ],

          by:auth.name
        }
      }
    );

    sync('ok');

  }catch(e){

    prev
      ?A[d][id]=prev
      :delete A[d][id];

    patch(id);

    sync('err');

    toast(
      e.message,
      true
    );

  }finally{

    pending--;

  }

}

/* =========================================================
   PEOPLE TAB
========================================================= */

function sst(s){

  const j=
    (s.created||'0')
    .slice(0,10);

  const cd=
    Object.keys(A)
    .filter(
      d=>d>=j&&marks(d)
    )
    .sort();

  let P=0;
  let L=0;
  let Ab=0;

  for(const d of cd){

    const m=A[d][s.id]?.s;

    m==='P'
      ?P++
      :m==='L'
        ?L++
        :Ab++;

  }

  return{
    cd,
    P,
    L,
    A:Ab,
    n:cd.length,

    rate:
      cd.length
        ?Math.round(
          (P+L)/cd.length*100
        )
        :null
  };

}

/* =========================================================

function profile(id){

  const x=sst(s);

  const C=
    2*Math.PI*44;

    const d of [...x.cd].reverse()

  const cells=[];

    if(A[d][id])

    .sort()
    .slice(-6);

  dr.className='dr';


  dr.innerHTML=`

  <div class="card">

    <div class="rg">

      <svg
        class="ring"
        width="110"
        height="110"
        viewBox="0 0 110 110"
      >

        <circle
          class="bg"
          cx="55"
          cy="55"
          r="44"
        />

        <circle
          class="fg"
          id="rg"
          cx="55"
          cy="55"
          r="44"
          stroke-dasharray="${C}"
          stroke-dashoffset="${C}"
        />

        <text
          x="55"
          y="62"
          text-anchor="middle"
        >
          ${
            x.rate==null
              ?'—'
              :x.rate+'%'
          }
        </text>

      </svg>


      <div class="kv">

        <div>
          <b>${x.P}</b>

        </div>

        <div>
          <b>${x.L}</b>
          Late
        </div>

        <div>
          <b>${x.A}</b>
          Absent
        </div>

        <div>
          <b>${streak}</b>
          Day streak
        </div>

      </div>

    </div>

  </div>


  <div class="card">

    <h3>

      ${cells.join('')}

      ?`👪 ${esc(s.guardian)}<br>`
      :''
    }

    ${
      s.notes
      ?`📝 ${esc(s.notes)}`
      :''
    }

    ${
      !s.phone &&
      !s.guardian &&
      !s.notes
      ?'<small>No details added</small>'
      :''
    }

  </div>


  <div class="f2">

    <button
      class="gh"
      id="d-e"
    >
      Edit
    </button>

    <button
      class="pri"
      id="d-d"
    >
      ⬇ Export Excel
    </button>

  </div>

  `;


  $('#d-x').onclick=closeDr;


  $('#d-e').onclick=()=>
    openForm(s);


  $('#d-d').onclick=()=>
    exportOne(s);


  requestAnimationFrame(
    ()=>
      setTimeout(
        ()=>{

          $('#rg').style.strokeDashoffset=
            C*
            (
              1-
              (x.rate||0)/
              100
            );


          dr
            .querySelectorAll(
              '.mb span'
            )
            .forEach(
              e=>
                e.style.height=
                  e.dataset.h*.6+
                  'px'
            );

        },
        60
      )
  );

}


$('#drawer').onclick=e=>{

  if(
    e.target.id==='drawer'
  )
    closeDr();

};


/* =========================================================
   EXPORT
========================================================= */

const L2={
  P:'Present',
  L:'Late',
  A:'Absent'
};


function exportAll(){

  if(!window.XLSX)
    return toast(
      'Excel library still loading, retry',
      true
    );


  const ds=
    Object.keys(A)
    .filter(marks)
    .sort();


  const all=
    S.filter(
      s=>s.active!==false
    );


  const st=
    all.map(
      s=>{

        const x=sst(s);

        return{

          ID:s.id,

          Name:s.name,

          Type:s.type||'student',

          Class:s.cls||'',

          Phone:s.phone||'',

          Guardian:s.guardian||'',

          Notes:s.notes||'',

          Joined:
            (s.created||'')
            .slice(0,10),

          Present:x.P,

          Late:x.L,

          Absent:x.A,

          'Attendance %':
            x.rate??''

        };

      }
    );


  const mx=
    all.map(
      s=>{

        const r={
          Name:s.name,
          Type:s.type||'student',
          Class:s.cls||''
        };


        ds.forEach(
          d=>
            r[d]=
              A[d][s.id]?.s||''
        );


        return r;

      }
    );


  const sm=
    ds.map(
      d=>{

        const v=
          Object.entries(A[d])
          .filter(
            e=>e[0][0]!=='_'
          )
          .map(
            e=>e[1].s
          );


        return{

          Date:d,

          Present:
            v.filter(
              a=>a==='P'
            ).length,

          Late:
            v.filter(
              a=>a==='L'
            ).length,

          Absent:
            v.filter(
              a=>a==='A'
            ).length,

          'Verified by':
            A[d]._v?.by||''

        };

      }
    );


  const wb=
    XLSX.utils.book_new();


  [
    ['People',st],
    ['Attendance grid',mx],
    ['Daily summary',sm]
  ]
  .forEach(
    ([n,d])=>
      XLSX.utils.book_append_sheet(
        wb,
        XLSX.utils.json_to_sheet(d),
        n
      )
  );


  XLSX.writeFile(
    wb,
    `attendance_${today()}.xlsx`
  );


  toast(
    'Excel downloaded'
  );

}


function exportOne(s){

  if(!window.XLSX)
    return toast(
      'Excel library still loading, retry',
      true
    );


  const x=sst(s);


  const rows=
    x.cd.map(
      d=>({

        Date:d,

        Status:
          L2[A[d][s.id]?.s]||
          'Absent (unmarked)',

        'Marked by':
          A[d][s.id]?.by||''

      })
    );


  const wb=
    XLSX.utils.book_new();


  XLSX.utils.book_append_sheet(
    wb,
    XLSX.utils.json_to_sheet(rows),
    'Attendance'
  );


  XLSX.writeFile(
    wb,
    `${s.name.replace(/\W+/g,'_')}_attendance.xlsx`
  );

}


$('#exp').onclick=exportAll;
